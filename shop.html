<script src="assets/app.js"></script>
<script>
function renderShop(){
 let list=[...PRODUCTS], q=queryParams(), category=q.get("category"), gender=q.get("gender");
 const cats=[...document.querySelectorAll('[data-filter="category"]:checked')].map(x=>x.value);
 const genders=[...document.querySelectorAll('[data-filter="gender"]:checked')].map(x=>x.value);
 const prices=[...document.querySelectorAll('[data-filter="price"]:checked')].map(x=>x.value);
 if(category && category!=="new") cats.push(category);
 if(gender) genders.push(gender);
 if(cats.length) list=list.filter(p=>cats.includes(p.category));
 if(genders.length) list=list.filter(p=>genders.includes(p.gender));
 if(prices.length) list=list.filter(p=>prices.some(r=>{let [a,b]=r.split("-").map(Number);return p.price>=a&&p.price<=b}));
 const sort=document.getElementById("sort").value;
 if(sort==="priceAsc")list.sort((a,b)=>a.price-b.price);
 if(sort==="priceDesc")list.sort((a,b)=>b.price-a.price);
 if(sort==="new")list.sort((a,b)=>(b.tag==="NEW")-(a.tag==="NEW"));
 document.getElementById("shopProducts").innerHTML=list.map(productCard).join("")||'<div class="empty" style="grid-column:1/-1"><h3>没有找到符合条件的商品</h3><p class="muted">试试清除筛选条件。</p></div>';
 document.getElementById("resultCount").textContent=`${list.length} 件商品`;
}
document.querySelectorAll("[data-filter]").forEach(x=>x.addEventListener("change",renderShop));
document.getElementById("sort").addEventListener("change",renderShop);
renderShop();initShell();
</script>
